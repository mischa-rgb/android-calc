:root[data-theme="dark"]{

*,*::before,*::after{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font-ui);font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

.app{max-width:900px;margin:0 auto;padding-block:16px 24px;padding-inline:16px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr);align-items:start}

/* Calculator body */

.lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:12px;padding:10px 14px 12px;box-shadow:inset 0 2px 6px var(--lcd-shade);font-family:var(--font-lcd);display:grid;gap:4px;min-height:118px}
.lcd-top{display:flex;align-items:center;gap:8px;min-height:24px}
.flags{display:flex;gap:6px;font-size:12px;flex:none}

.expr{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;text-align:right;font-size:17px;color:var(--lcd-dim);scrollbar-width:none}

.strip{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none;min-height:36px;align-items:center}

.mem-name{font-weight:600;font-size:15px;overflow-wrap:anywhere}

.sb-val{font:24px var(--font-lcd)}

.err{margin:0;font-size:13px;color:var(--clear)}
.sb-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.editbox label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}

.row{display:flex;gap:8px;flex-wrap:wrap}

.empty{display:grid;gap:14px}

.example{border:1px dashed var(--line);border-radius:12px;padding:12px 14px 6px}

.ex-name span{font:18px var(--font-lcd);font-weight:400}
.p-empty{margin:0;color:var(--muted)}

.d-head{display:grid;gap:4px;margin-bottom:14px}
.d-name{font:700 20px var(--font-ui);overflow-wrap:anywhere;text-wrap:balance}
.d-val{font:34px var(--font-lcd)}
.d-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.trail-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}

.tr{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;width:100%;text-align:left;background:none;border:0;padding:8px 6px 8px 0;border-radius:10px;color:inherit;font:inherit;position:relative}
button.tr{cursor:pointer}
button.tr:hover{background:var(--chip)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin:6px 0 0 7px;box-shadow:0 0 0 3px var(--paper);position:relative;z-index:1}
.tr-used .dot{background:var(--paper);border:1.5px solid var(--muted)}
.tr-rename .dot{background:var(--muted)}
.tr-body{display:block;min-width:0}
.tr-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tr-kind{font-weight:600;font-size:13px}
.tr-time{font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
.tr-main{display:block;font:16px var(--font-lcd);overflow-wrap:anywhere;margin-top:2px}
.tr-sub{display:block;font:13px var(--font-lcd);color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
.p-foot{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);line-height:1.45}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:819px){

}

<script>
(function(){
'use strict';
const D = window.Decimal;
D.set({ precision: 40, rounding: D.ROUND_HALF_UP, toExpNeg: -40, toExpPos: 40 });

const S = {
  tokens: [], done: false, result: null, lastTokens: [], error: '',
  mems: [], memsReady: false, storeKind: null, storeErr: false,
  view: 'list', detailId: null, saving: null, saveErr: '', editing: false, editErr: '',
  confirmDelete: false, trailFilter: 'all', sheetOpen: false
};
let store = null;

const $ = id => document.getElementById(id);
const exprEl = $('expr'), mainEl = $('main'), flagM = $('flagM'), flagE = $('flagE'),
  stripEl = $('strip'), keysEl = $('keys'), panel = $('panel'), panelBody = $('panelBody'),
  scrim = $('scrim'), toastEl = $('toast');

const memById = id => S.mems.find(m => m.id === id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const narrowMQ = window.matchMedia('(max-width: 819px)');
const isNarrow = () => narrowMQ.matches;

// --- arithmetic ---
const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
function groupInt(s){ return s.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function fmtTyped(s){
  const neg = s.charAt(0) === '-'; if (neg) s = s.slice(1);
  if (s === '') return neg ? '−' : '';
  const dot = s.indexOf('.');
  const i = dot === -1 ? s : s.slice(0, dot);
  const f = dot === -1 ? null : s.slice(dot + 1);
  return (neg ? '−' : '') + groupInt(i || '0') + (f === null ? '' : '.' + f);
}
function fmt(d){
  if (d.isZero()) return '0';
  const a = d.abs();
  if (a.gte('1e12') || a.lt('1e-9')){
    let parts = d.toSignificantDigits(8).toExponential().split('e');
    let m = parts[0];
    if (m.indexOf('.') !== -1) m = m.replace(/0+$/, '').replace(/\.$/, '');
    return m.replace('-', '−') + 'e' + parts[1].replace('+', '');
  }
  let s = d.toSignificantDigits(12).toFixed();
  const neg = s.charAt(0) === '-'; if (neg) s = s.slice(1);
  const parts = s.split('.');
  const f = parts[1] ? parts[1].replace(/0+$/, '') : '';
  return (neg ? '−' : '') + groupInt(parts[0]) + (f ? '.' + f : '');
}
const storeStr = d => d.toSignificantDigits(24).toFixed();
function fmtStr(s){ try { return fmt(new D(s)); } catch (e){ return String(s); } }
function signed(s){ try { const x = new D(s); return x.isNeg() ? fmt(x) : '+' + fmt(x); } catch (e){ return String(s); } }

function evaluate(tokens, lookup){
  lookup = lookup || memById;
  const ts = tokens.slice();
  while (ts.length){
    const t = ts[ts.length - 1];
    if (t.t === 'op' || t.t === 'lp' || (t.t === 'num' && t.s === '-')) ts.pop(); else break;
  }
  if (!ts.length) return { ok: false, empty: true };
  let open = 0;
  ts.forEach(t => { if (t.t === 'lp') open++; else if (t.t === 'rp') open--; });
  for (; open > 0; open--) ts.push({ t: 'rp' });
  let i = 0;
  const fail = msg => { const e = new Error(msg); e.user = true; throw e; };
  function primary(){
    const t = ts[i++];
    if (!t) fail('Finish the sum');
    if (t.t === 'num'){
      let s = t.s; if (s.endsWith('.')) s = s.slice(0, -1);
      if (s === '' || s === '-') fail('Finish the number');
      return new D(s);
    }
    if (t.t === 'val') return t.val;
    if (t.t === 'var'){
      const m = lookup(t.id);
      if (!m) fail('A memory in this sum was deleted');
      const v = new D(m.value);
      return t.neg ? v.neg() : v;
    }
    if (t.t === 'lp'){
      const v = expr();
      if (ts[i] && ts[i].t === 'rp') i++; else fail('Close the bracket');
      return v;
    }
    fail('Finish the sum');
  }
  function factor(){
    const raw = primary();
    if (ts[i] && ts[i].t === 'pct'){ i++; return { val: raw.div(100), pct: true, raw }; }
    return { val: raw, pct: false, raw };
  }
  function term(){
    const f = factor();
    let val = f.val, single = true;
    while (ts[i] && ts[i].t === 'op' && (ts[i].v === '*' || ts[i].v === '/')){
      const op = ts[i++].v; const g = factor(); single = false;
      if (op === '*') val = val.mul(g.val);
      else { if (g.val.isZero()) fail("Can't divide by zero"); val = val.div(g.val); }
    }
    return { val, pctOnly: single && f.pct, raw: f.raw };
  }
  function expr(){
    let left = term().val;
    while (ts[i] && ts[i].t === 'op' && (ts[i].v === '+' || ts[i].v === '-')){
      const op = ts[i++].v; const r = term();
      const rv = r.pctOnly ? left.mul(r.raw).div(100) : r.val;  // 200 + 10% = 220
      left = op === '+' ? left.add(rv) : left.sub(rv);
    }
    return left;
  }
  try {
    const v = expr();
    if (i < ts.length) fail('Check the sum');
    if (!v.isFinite()) fail('Too large');
    return { ok: true, val: v, ts };
  } catch (e){
    return { ok: false, msg: e && e.user ? e.message : 'Check the sum' };
  }
}
// --- end arithmetic ---

function exprText(ts){
  return ts.map(t => {
    if (t.t === 'num') return fmtTyped(t.s);
    if (t.t === 'val') return fmt(t.val);
    if (t.t === 'var'){ const m = memById(t.id); return (t.neg ? '−' : '') + (m ? m.name : '?'); }
    if (t.t === 'op') return ' ' + OPS[t.v] + ' ';
    if (t.t === 'lp') return '(';
    if (t.t === 'rp') return ')';
    if (t.t === 'pct') return '%';
    return '';
  }).join('').trim();
}
function tokensHTML(ts){
  return ts.map(t => {
    if (t.t === 'num') return '<span>' + esc(fmtTyped(t.s)) + '</span>';
    if (t.t === 'val') return '<span>' + esc(fmt(t.val)) + '</span>';
    if (t.t === 'var'){
      const m = memById(t.id);
      return '<span class="v' + (m ? '' : ' missing') + '">' + (t.neg ? '−' : '') + esc(m ? m.name : 'deleted') + '</span>';
    }
    if (t.t === 'op') return '<span class="op">' + OPS[t.v] + '</span>';
    if (t.t === 'lp') return '<span>(</span>';
    if (t.t === 'rp') return '<span>)</span>';
    if (t.t === 'pct') return '<span>%</span>';
    return '';
  }).join('');
}

// --- keypad input ---
const last = () => S.tokens[S.tokens.length - 1];
const isValueEnd = t => !!t && (t.t === 'num' || t.t === 'var' || t.t === 'val' || t.t === 'rp' || t.t === 'pct');
const digitCount = s => s.replace(/[^0-9]/g, '').length;
function startFresh(){ if (S.done){ S.tokens = []; S.done = false; } }
function continueFromResult(){
  if (S.done){ S.tokens = S.result ? [{ t: 'val', val: S.result }] : []; S.done = false; }
}
function pushOperandStart(){ if (isValueEnd(last())) S.tokens.push({ t: 'op', v: '*' }); }

function pressDigit(d){
  startFresh();
  const t = last();
  if (t && t.t === 'num'){
    if (digitCount(t.s) >= 12){ toast('12 digits max per number'); return; }
    if (t.s === '0') t.s = d; else if (t.s === '-0') t.s = '-' + d; else t.s += d;
  } else {
    pushOperandStart();
    S.tokens.push({ t: 'num', s: d });
  }
}
function pressDoubleZero(){
  startFresh();
  const t = last();
  if (t && t.t === 'num' && t.s !== '0' && t.s !== '-0' && t.s !== '-' && t.s !== ''){
    const room = 12 - digitCount(t.s);
    if (room <= 0){ toast('12 digits max per number'); return; }
    t.s += room >= 2 ? '00' : '0';
  } else pressDigit('0');
}
function pressDot(){
  startFresh();
  const t = last();
  if (t && t.t === 'num'){
    if (t.s.indexOf('.') === -1) t.s += (t.s === '' || t.s === '-') ? '0.' : '.';
    return;
  }
  pushOperandStart();
  S.tokens.push({ t: 'num', s: '0.' });
}
function pressOp(op){
  continueFromResult();
  let t = last();
  if (!t){
    if (op === '-'){ S.tokens.push({ t: 'num', s: '-' }); return; }
    S.tokens.push({ t: 'num', s: '0' }); t = last();
  }
  if (t.t === 'op'){ t.v = op; return; }
  if (t.t === 'lp'){ if (op === '-') S.tokens.push({ t: 'num', s: '-' }); return; }
  if (t.t === 'num'){
    if (t.s === '-') return;
    if (t.s.endsWith('.')) t.s = t.s.slice(0, -1);
  }
  S.tokens.push({ t: 'op', v: op });
}
function pressLP(){ startFresh(); pushOperandStart(); S.tokens.push({ t: 'lp' }); }
function pressRP(){
  if (S.done) return;
  let open = 0; S.tokens.forEach(t => { if (t.t === 'lp') open++; else if (t.t === 'rp') open--; });
  const t = last();
  if (open <= 0 || !isValueEnd(t) || (t.t === 'num' && t.s === '-')) return;
  if (t.t === 'num' && t.s.endsWith('.')) t.s = t.s.slice(0, -1);
  S.tokens.push({ t: 'rp' });
}
function pressPct(){
  continueFromResult();
  const t = last();
  if (!isValueEnd(t) || t.t === 'pct' || (t.t === 'num' && t.s === '-')) return;
  S.tokens.push({ t: 'pct' });
}
function pressNeg(){
  continueFromResult();
  const t = last();
  if (!t) return;
  if (t.t === 'num'){ t.s = t.s.charAt(0) === '-' ? t.s.slice(1) : '-' + t.s; if (t.s === '') S.tokens.pop(); }
  else if (t.t === 'var') t.neg = !t.neg;
  else if (t.t === 'val') t.val = t.val.neg();
}
function pressBack(){
  if (S.done){ S.done = false; S.tokens = S.lastTokens.map(t => Object.assign({}, t)); return; }
  const t = last();
  if (!t) return;
  if (t.t === 'num'){ t.s = t.s.slice(0, -1); if (t.s === '') S.tokens.pop(); }
  else S.tokens.pop();
}
function pressAC(){ S.tokens = []; S.done = false; S.result = null; S.lastTokens = []; }
function pressEq(){
  if (S.done) return;
  const r = evaluate(S.tokens);
  if (!r.ok){ if (!r.empty) S.error = r.msg; return; }
  S.lastTokens = r.ts; S.result = r.val; S.done = true;
  recordUses(r.ts, r.val);
}
function insertVar(id){ S.error = ''; startFresh(); pushOperandStart(); S.tokens.push({ t: 'var', id, neg: false }); }
function insertValue(v){ S.error = ''; startFresh(); pushOperandStart(); S.tokens.push({ t: 'val', val: new D(v) }); }

function press(k){
  if (k === 'save'){ pressSave(); return; }
  S.error = '';
  switch (k){
    case 'ac': pressAC(); break;
    case 'back': pressBack(); break;
    case 'neg': pressNeg(); break;
    case '%': pressPct(); break;
    case '(': pressLP(); break;
    case ')': pressRP(); break;
    case '=': pressEq(); break;
    case '+': case '-': case '*': case '/': pressOp(k); break;
    case '.': pressDot(); break;
    case '00': pressDoubleZero(); break;
    default: if (/^[0-9]$/.test(k)) pressDigit(k);
  }
  renderLCD();
}

// --- memories ---
function newId(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function nameTaken(name, exceptId){ const n = name.toLowerCase(); return S.mems.some(m => m.id !== exceptId && m.name.toLowerCase() === n); }
function nextDefaultName(){ let n = 1; while (nameTaken('Memory ' + n)) n++; return 'Memory ' + n; }
function capTrail(tr){
  const MAX = 200;
  if (tr.length <= MAX) return tr;
  const out = tr.slice();
  for (let i = out.length - 1; i >= 0 && out.length > MAX; i--) if (out[i].k === 'used') out.splice(i, 1);
  return out.length > MAX ? out.slice(0, MAX) : out;
}
function currentValue(){
  if (S.done && S.result) return { val: S.result, ts: S.lastTokens };
  const r = evaluate(S.tokens);
  return r.ok ? { val: r.val, ts: r.ts } : null;
}
function applyLocal(m){
  const i = S.mems.findIndex(x => x.id === m.id);
  if (i === -1) S.mems = [m].concat(S.mems); else { S.mems = S.mems.slice(); S.mems[i] = m; }
  S.mems.sort((a, b) => b.createdAt - a.createdAt);
}
async function write(fn){
  try { await fn(); }
  catch (e){
    if (e && e.code === 'unavailable'){
      await new Promise(r => setTimeout(r, 500 + Math.random() * 700));
      try { await fn(); return; } catch (e2){ e = e2; }
    }
    toast(e && e.code === 'quota_exceeded'
      ? 'Storage is full. Delete a memory you no longer need, then try again.'
      : "Couldn't save that change. Check your connection and try again.");
  }
}
function commit(m, msg){
  if (!store) return;
  applyLocal(m); renderAll();
  if (msg) toast(msg);
  write(() => store.put(m));
}
function recordUses(ts, val){
  if (!store) return;
  const ids = Array.from(new Set(ts.filter(t => t.t === 'var').map(t => t.id)));
  if (!ids.length) return;
  const now = Date.now(), e = exprText(ts), r = storeStr(val);
  ids.forEach(id => {
    const m = memById(id); if (!m) return;
    commit(Object.assign({}, m, { trail: capTrail([{ k: 'used', e, r, v: m.value, at: now }].concat(m.trail)) }));
  });
}
function pressSave(){
  const cv = currentValue();
  if (!cv){ toast('Type a number or finish the sum first'); return; }
  const single = cv.ts.length === 1 && (cv.ts[0].t === 'num' || cv.ts[0].t === 'val');
  S.saving = { value: storeStr(cv.val), expr: single ? null : exprText(cv.ts) };
  S.saveErr = ''; S.view = 'list'; S.editing = false; S.confirmDelete = false;
  if (isNarrow()) openSheet();
  renderPanel();
  if (!isNarrow()) panel.scrollTop = 0;
  focusSoon('memName', isNarrow() ? 260 : 0);
}
function doSaveNew(){
  if (!S.saving) return;
  if (!store){ toast('Still opening your memories. Try again in a moment.'); return; }
  const el = $('memName');
  let name = (el ? el.value : '').trim().replace(/\s+/g, ' ').slice(0, 30);
  if (!name) name = nextDefaultName();
  if (nameTaken(name)){
    S.saveErr = 'You already have a memory called “' + name + '”. Pick another name, or use Replace or Add to on it below.';
    renderPanel(); focusSoon('memName', 0); return;
  }
  const now = Date.now(), sv = S.saving;
  const m = { id: newId(), name, value: sv.value, createdAt: now, updatedAt: now,
    trail: [{ k: 'created', v: sv.value, e: sv.expr, at: now }] };
  S.saving = null; S.saveErr = '';
  if (isNarrow()) closeSheet();
  commit(m, 'Saved as ' + name);
}
function doUpdate(id, kind){
  const m = memById(id); if (!m || !S.saving) return;
  const now = Date.now(), sv = S.saving;
  const v = kind === 'replace' ? sv.value : storeStr(new D(m.value).add(new D(sv.value)));
  const entry = kind === 'replace'
    ? { k: 'set', prev: m.value, v, e: sv.expr, at: now }
    : { k: 'add', d: sv.value, prev: m.value, v, e: sv.expr, at: now };
  S.saving = null; S.saveErr = '';
  if (isNarrow()) closeSheet();
  commit(Object.assign({}, m, { value: v, updatedAt: now, trail: capTrail([entry].concat(m.trail)) }), m.name + ' is now ' + fmtStr(v));
}
function doEdit(){
  const m = memById(S.detailId); if (!m) return;
  const name = ($('editName').value || '').trim().replace(/\s+/g, ' ').slice(0, 30);
  const raw = ($('editVal').value || '').replace(/[,\s]/g, '').replace(/−/g, '-');
  if (!name){ S.editErr = 'Give it a name.'; renderPanel(); return; }
  if (nameTaken(name, m.id)){ S.editErr = 'You already have a memory called “' + name + '”.'; renderPanel(); return; }
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(raw)){ S.editErr = 'Enter a number, like 12500 or 12,500.50.'; renderPanel(); return; }
  const now = Date.now(), nv = new D(raw);
  let trail = m.trail, changed = false, value = m.value;
  if (name !== m.name){ trail = [{ k: 'rename', from: m.name, to: name, at: now }].concat(trail); changed = true; }
  if (!nv.eq(new D(m.value))){ value = storeStr(nv); trail = [{ k: 'edit', prev: m.value, v: value, at: now }].concat(trail); changed = true; }
  S.editing = false; S.editErr = '';
  if (!changed){ renderPanel(); return; }
  commit(Object.assign({}, m, { name, value, updatedAt: now, trail: capTrail(trail) }), 'Changes saved');
}
function removeMem(id){
  const m = memById(id); if (!m || !store) return;
  S.mems = S.mems.filter(x => x.id !== id);
  S.view = 'list'; S.confirmDelete = false;
  renderAll();
  toast('Deleted ' + m.name);
  write(() => store.remove(id));
}

// --- rendering ---
const tFmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
const dFmt = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' });
const yFmt = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
function when(at, short){
  const d = new Date(at), n = new Date(), y = new Date(n); y.setDate(n.getDate() - 1);
  let day;
  if (d.toDateString() === n.toDateString()) day = 'Today';
  else if (d.toDateString() === y.toDateString()) day = 'Yesterday';
  else day = (d.getFullYear() === n.getFullYear() ? dFmt : yFmt).format(d);
  return short ? day : day + ', ' + tFmt.format(d);
}

function sizeMain(){
  const len = mainEl.textContent.length;
  if (mainEl.classList.contains('is-err')){ mainEl.style.fontSize = ''; return; }
  mainEl.style.fontSize = len <= 11 ? '' : len <= 14 ? '38px' : len <= 18 ? '30px' : '24px';
}
function renderLCD(){
  mainEl.className = 'main';
  exprEl.innerHTML = '';
  flagM.hidden = !S.mems.length;
  flagE.hidden = !S.error;
  const ts = S.tokens;
  if (S.error){
    exprEl.innerHTML = tokensHTML(ts);
    mainEl.textContent = S.error; mainEl.classList.add('is-err');
  } else if (S.done){
    exprEl.innerHTML = tokensHTML(S.lastTokens) + '<span class="op">=</span>';
    mainEl.textContent = fmt(S.result);
  } else if (!ts.length){
    mainEl.textContent = '0';
  } else if (ts.length === 1 && ts[0].t === 'num'){
    mainEl.textContent = fmtTyped(ts[0].s) || '0';
  } else if (ts.length === 1 && ts[0].t === 'val'){
    mainEl.textContent = fmt(ts[0].val);
  } else {
    exprEl.innerHTML = tokensHTML(ts);
    const r = evaluate(ts);
    mainEl.classList.add('is-preview');
    if (r.ok) mainEl.textContent = fmt(r.val);
    else { mainEl.textContent = r.empty ? '' : r.msg; if (!r.empty) mainEl.classList.add('is-err'); }
  }
  sizeMain();
  exprEl.scrollLeft = exprEl.scrollWidth;
}

function renderStrip(){
  if (!S.memsReady){ stripEl.innerHTML = '<span class="strip-hint">Opening your memories…</span>'; return; }
  if (!S.mems.length){
    stripEl.innerHTML = '<span class="strip-hint">Tap Save to keep a number as a memory.</span><button class="chip chip-all" data-act="open">Memories</button>';
    return;
  }
  stripEl.innerHTML = S.mems.map(m =>
    '<button class="chip" data-act="use" data-id="' + esc(m.id) + '"><span>' + esc(m.name) + '</span><span class="chip-val">' + esc(fmtStr(m.value)) + '</span></button>'
  ).join('') + '<button class="chip chip-all" data-act="open">All memories ›</button>';
}

function shortDesc(t){
  switch (t.k){
    case 'created': return 'Saved';
    case 'set': return 'Replaced';
    case 'add': return 'Added ' + signed(t.d);
    case 'edit': return 'Edited';
    case 'rename': return 'Renamed';
    default: return '';
  }
}
function trailItemHTML(t, interactive){
  let kind = '', main = '', sub = '', use = null;
  switch (t.k){
    case 'created': kind = 'Saved'; main = fmtStr(t.v); sub = t.e ? 'from ' + t.e : 'typed in'; use = t.v; break;
    case 'set': kind = 'Replaced'; main = fmtStr(t.prev) + ' → ' + fmtStr(t.v); sub = t.e ? 'new value from ' + t.e : ''; use = t.v; break;
    case 'add': kind = 'Added ' + signed(t.d); main = fmtStr(t.prev) + ' → ' + fmtStr(t.v); sub = t.e ? fmtStr(t.d) + ' came from ' + t.e : ''; use = t.v; break;
    case 'edit': kind = 'Edited by hand'; main = fmtStr(t.prev) + ' → ' + fmtStr(t.v); use = t.v; break;
    case 'rename': kind = 'Renamed'; main = t.from + ' → ' + t.to; break;
    case 'used': kind = 'Used in'; main = (t.e || '') + ' = ' + fmtStr(t.r); sub = 'value at the time: ' + fmtStr(t.v); use = t.r; break;
    default: return '';
  }
  const inner = '<span class="dot" aria-hidden="true"></span><span class="tr-body"><span class="tr-top"><span class="tr-kind">' + esc(kind) +
    '</span><time class="tr-time">' + esc(when(t.at)) + '</time></span><span class="tr-main">' + esc(main) + '</span>' +
    (sub ? '<span class="tr-sub">' + esc(sub) + '</span>' : '') + '</span>';
  const cls = 'tr tr-' + t.k;
  if (interactive && use != null) return '<li><button type="button" class="' + cls + '" data-act="usev" data-v="' + esc(use) + '">' + inner + '</button></li>';
  return '<li><span class="' + cls + '">' + inner + '</span></li>';
}

function saveBoxHTML(){
  const s = S.saving;
  return '<form class="savebox" data-form="save" novalidate>' +
    '<div class="sb-top"><span class="sb-label">Save this number</span><span class="sb-val">' + esc(fmtStr(s.value)) + '</span></div>' +
    (s.expr ? '<div class="sb-expr">from ' + esc(s.expr) + '</div>' : '') +
    '<label class="sr-only" for="memName">Memory name</label>' +
    '<div class="field-row"><input class="input" id="memName" placeholder="Name it, e.g. Rent" maxlength="30" autocomplete="off" enterkeyhint="done"><button type="submit" class="btn-primary">Save</button></div>' +
    (S.saveErr ? '<p class="err" role="alert">' + esc(S.saveErr) + '</p>' : '') +
    '<div class="sb-foot"><span>' + (S.mems.length ? 'Or replace or add to one below.' : 'Leave it blank to call it ' + esc(nextDefaultName()) + '.') +
    '</span><button type="button" class="btn" data-act="cancelsave">Cancel</button></div></form>';
}
function emptyHTML(){
  const now = Date.now(), day = 86400000;
  const ex = [
    { k: 'used', e: 'Rent × 12', r: '156000', v: '13000', at: now - day * 0.2 },
    { k: 'add', d: '500', prev: '12500', v: '13000', e: null, at: now - day * 3 },
    { k: 'created', v: '12500', e: '10,000 + 2,500', at: now - day * 30 }
  ];
  return '<div class="empty"><p>Do a sum, then tap <b>Save</b> to keep the answer as a memory. Tap a memory to drop it into your next sum. Each one keeps a trail: how it got its value, and every sum it went into.</p>' +
    '<div class="example"><div class="example-tag">Example</div><div class="ex-name">Rent <span>13,000</span></div><ol class="trail">' +
    ex.map(t => trailItemHTML(t, false)).join('') + '</ol></div></div>';
}
function rowHTML(m){
  const lastChange = m.trail.find(t => t.k !== 'used');
  const uses = m.trail.filter(t => t.k === 'used').length;
  const bits = [];
  if (lastChange) bits.push(shortDesc(lastChange) + ' ' + when(lastChange.at, true).toLowerCase().replace(/^(\d)/, '$1'));
  if (uses) bits.push('used in ' + uses + (uses === 1 ? ' sum' : ' sums'));
  const body = '<span class="mem-name">' + esc(m.name) + '</span><span class="mem-val">' + esc(fmtStr(m.value)) + '</span><span class="mem-sub">' + esc(bits.join(' · ')) + '</span>';
  if (S.saving){
    return '<li class="mem-row"><div class="mem-use">' + body + '</div><div class="mem-upd">' +
      '<button class="btn" data-act="replace" data-id="' + esc(m.id) + '">Replace</button>' +
      '<button class="btn" data-act="add" data-id="' + esc(m.id) + '">Add to</button></div></li>';
  }
  return '<li class="mem-row"><button class="mem-use" data-act="use" data-id="' + esc(m.id) + '" aria-label="Use ' + esc(m.name) + ' in the sum">' + body + '</button>' +
    '<button class="btn" data-act="trail" data-id="' + esc(m.id) + '" aria-label="Show the trail for ' + esc(m.name) + '">Trail</button></li>';
}
function listHTML(){
  const n = S.mems.length;
  let h = '<header class="p-head"><div class="p-title"><h2>Memories</h2><span class="p-count">' + (S.memsReady && n ? n + ' saved' : '') + '</span></div>' +
    '<button class="btn p-close" data-act="close">Close</button></header>';
  if (S.saving) h += saveBoxHTML();
  if (!S.memsReady) h += '<p class="p-empty">Opening your memories…</p>';
  else if (!n){ if (!S.saving) h += emptyHTML(); }
  else h += '<ul class="mem-list">' + S.mems.map(rowHTML).join('') + '</ul>';
  return h;
}
function detailHTML(m){
  let h = '<header class="p-head"><button class="btn" data-act="back">‹ All memories</button><button class="btn p-close" data-act="close">Close</button></header>' +
    '<div class="d-head"><div class="d-name">' + esc(m.name) + '</div><div class="d-val">' + esc(fmtStr(m.value)) + '</div>' +
    '<div class="d-actions"><button class="btn-primary" data-act="use" data-id="' + esc(m.id) + '">Use in sum</button>' +
    '<button class="btn" data-act="edit">Edit</button><button class="btn btn-danger" data-act="askdel">Delete</button></div></div>';
  if (S.editing){
    h += '<form class="editbox" data-form="edit" novalidate>' +
      '<label for="editName">Name</label><input class="input" id="editName" value="' + esc(m.name) + '" maxlength="30" autocomplete="off">' +
      '<label for="editVal">Value</label><input class="input" id="editVal" value="' + esc(m.value) + '" inputmode="decimal" autocomplete="off">' +
      (S.editErr ? '<p class="err" role="alert">' + esc(S.editErr) + '</p>' : '') +
      '<div class="row"><button type="submit" class="btn-primary">Save changes</button><button type="button" class="btn" data-act="canceledit">Cancel</button></div></form>';
  }
  if (S.confirmDelete){
    h += '<div class="confirm"><p>Delete ' + esc(m.name) + ' and its whole trail? This can’t be undone.</p>' +
      '<div class="row"><button class="btn btn-danger-solid" data-act="del">Delete</button><button class="btn" data-act="keep">Keep it</button></div></div>';
  }
  const items = S.trailFilter === 'changes' ? m.trail.filter(t => t.k !== 'used') : m.trail;
  h += '<div class="trail-head"><h3>Trail</h3><div class="seg" role="group" aria-label="Show in trail">' +
    '<button data-act="filter" data-f="all" aria-pressed="' + (S.trailFilter === 'all') + '">Everything</button>' +
    '<button data-act="filter" data-f="changes" aria-pressed="' + (S.trailFilter === 'changes') + '">Value changes</button></div></div>' +
    '<p class="hint">Newest first. Tap a line to put that number into your sum.</p>' +
    '<ol class="trail">' + items.map(t => trailItemHTML(t, true)).join('') + '</ol>';
  return h;
}
function footHTML(){
  let t = '';
  if (S.storeErr) t = "Couldn't reach your saved memories. Reload the page to try again.";
  else if (S.storeKind === 'db') t = 'Private to you and kept with this page, so the same memories show on your phone and your computer.';
  else if (S.storeKind === 'local') t = 'Saved on this phone. Your memories stay when you install an update.';
  return t ? '<footer class="p-foot">' + esc(t) + '</footer>' : '';
}
function captureInputs(){
  const out = {};
  ['memName', 'editName', 'editVal'].forEach(id => {
    const el = $(id);
    if (el) out[id] = { v: el.value, f: document.activeElement === el, s: el.selectionStart, e: el.selectionEnd };
  });
  return out;
}
function restoreInputs(o){
  Object.keys(o).forEach(id => {
    const el = $(id); if (!el) return;
    el.value = o[id].v;
    if (o[id].f){ el.focus({ preventScroll: true }); try { el.setSelectionRange(o[id].s, o[id].e); } catch (e){} }
  });
}
function renderPanel(){
  const keep = captureInputs();
  const m = S.view === 'detail' ? memById(S.detailId) : null;
  panelBody.innerHTML = '<div class="grab" aria-hidden="true"></div>' + (m ? detailHTML(m) : listHTML()) + footHTML();
  restoreInputs(keep);
}
function renderAll(){ renderLCD(); renderStrip(); renderPanel(); }

// --- sheet, toast, focus ---
function openSheet(){ if (!isNarrow()) return; S.sheetOpen = true; panel.classList.add('open'); scrim.hidden = false; panel.scrollTop = 0; }
function closeSheet(){
  S.sheetOpen = false; panel.classList.remove('open'); scrim.hidden = true;
  S.saving = null; S.saveErr = ''; S.editing = false; S.confirmDelete = false;
}
narrowMQ.addEventListener('change', () => { if (!isNarrow()){ S.sheetOpen = false; panel.classList.remove('open'); scrim.hidden = true; } });
let toastTimer;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}
function focusSoon(id, ms){ setTimeout(() => { const el = $(id); if (el) el.focus(); }, ms || 0); }
function vib(){ try { if (navigator.vibrate) navigator.vibrate(6); } catch (e){} }
function flashKey(k){
  const b = keysEl.querySelector('[data-k="' + (window.CSS && CSS.escape ? CSS.escape(k) : k) + '"]');
  if (!b) return; b.classList.add('pressed'); setTimeout(() => b.classList.remove('pressed'), 90);
}
function cancelForms(){
  if (S.editing){ S.editing = false; S.editErr = ''; }
  else if (S.saving){ S.saving = null; S.saveErr = ''; if (isNarrow()) closeSheet(); }
  renderPanel();
}

// --- events ---
keysEl.addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  vib(); press(b.dataset.k);
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act){
    case 'use': insertVar(id); if (S.sheetOpen) closeSheet(); renderAll(); break;
    case 'usev': insertValue(b.dataset.v); if (S.sheetOpen) closeSheet(); renderAll(); break;
    case 'open': S.view = 'list'; openSheet(); renderPanel(); break;
    case 'close': closeSheet(); renderPanel(); break;
    case 'trail': S.view = 'detail'; S.detailId = id; S.editing = false; S.confirmDelete = false; S.editErr = ''; renderPanel(); panel.scrollTop = 0; break;
    case 'back': S.view = 'list'; S.editing = false; S.confirmDelete = false; renderPanel(); break;
    case 'replace': case 'add': doUpdate(id, act); break;
    case 'cancelsave': S.saving = null; S.saveErr = ''; if (isNarrow()) closeSheet(); renderPanel(); break;
    case 'edit': S.editing = true; S.confirmDelete = false; S.editErr = ''; renderPanel(); focusSoon('editName', 0); break;
    case 'canceledit': S.editing = false; S.editErr = ''; renderPanel(); break;
    case 'askdel': S.confirmDelete = true; S.editing = false; renderPanel(); break;
    case 'keep': S.confirmDelete = false; renderPanel(); break;
    case 'del': removeMem(S.detailId); break;
    case 'filter': S.trailFilter = b.dataset.f === 'changes' ? 'changes' : 'all'; renderPanel(); break;
  }
});
panelBody.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'save') doSaveNew(); else if (f === 'edit') doEdit();
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea'){ if (e.key === 'Escape') cancelForms(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if ((e.key === 'Enter' || e.key === ' ') && tag === 'button') return;
  const map = { 'Enter': '=', '=': '=', 'Backspace': 'back', 'Escape': 'esc', 'Delete': 'ac', '*': '*', 'x': '*', 'X': '*',
    '/': '/', '+': '+', '-': '-', '(': '(', ')': ')', '%': '%', '.': '.', ',': '.' };
  let k = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
  if (!k) return;
  e.preventDefault();
  if (k === 'esc'){ if (S.sheetOpen){ closeSheet(); renderPanel(); return; } k = 'ac'; }
  flashKey(k); press(k);
});

// --- storage: private per-person db when signed in, this browser otherwise ---
function normalize(m){
  if (!m || typeof m.name !== 'string') return null;
  let value = String(m.value == null ? '0' : m.value);
  try { new D(value); } catch (e){ value = '0'; }
  return { id: m.id, name: m.name, value, createdAt: +m.createdAt || 0, updatedAt: +m.updatedAt || 0,
    trail: Array.isArray(m.trail) ? m.trail : [] };
}
function dbStore(db, uid){
  const col = db.doc('data/users/' + uid + '/calc').collection('memories');
  const queues = new Map();
  const enqueue = (id, fn) => {
    const p = (queues.get(id) || Promise.resolve()).catch(() => {}).then(fn);
    queues.set(id, p); return p;
  };
  return {
    kind: 'db',
    subscribe(cb, onErr){
      col.onSnapshot(snap => cb(snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data()))), onErr);
    },
    put(m){
      const body = JSON.parse(JSON.stringify({ name: m.name, value: m.value, createdAt: m.createdAt, updatedAt: m.updatedAt, trail: m.trail }));
      return enqueue(m.id, () => col.doc(m.id).set(body));
    },
    remove(id){ return enqueue(id, () => col.doc(id).delete()); }
  };
}
function localStore(){
  const KEY = 'recall-calculator-memories-v1';
  let map = {};
  try { map = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e){ map = {}; }
  let cb = () => {};
  const emit = () => cb(Object.keys(map).map(id => Object.assign({ id }, map[id])));
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(map)); } catch (e){} };
  return {
    kind: 'local',
    subscribe(f){ cb = f; emit(); },
    put(m){ map[m.id] = { name: m.name, value: m.value, createdAt: m.createdAt, updatedAt: m.updatedAt, trail: m.trail }; persist(); emit(); return Promise.resolve(); },
    remove(id){ delete map[id]; persist(); emit(); return Promise.resolve(); }
  };
}
async function initStore(){
  try {
    if (window.claude && typeof window.claude.use === 'function'){
      const both = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (both[0] && both[1]){
        const uid = await both[1].id();
        if (uid) return dbStore(both[0], uid);
      }
    }
  } catch (e){}
  return localStore();
}

// Android back button: close the open form or sheet before leaving the app.
window.recallBack = function(){
  if (S.editing || S.confirmDelete){ S.editing = false; S.confirmDelete = false; S.editErr = ''; renderPanel(); return true; }
  if (S.sheetOpen && S.view === 'detail'){ S.view = 'list'; renderPanel(); return true; }
  if (S.sheetOpen || S.saving){ closeSheet(); renderPanel(); return true; }
  return false;
};

renderAll();
initStore().then(st => {
  store = st; S.storeKind = st.kind;
  st.subscribe(list => {
    S.mems = list.map(normalize).filter(Boolean).sort((a, b) => b.createdAt - a.createdAt);
    S.memsReady = true;
    if (S.view === 'detail' && !memById(S.detailId)) S.view = 'list';
    renderAll();
  }, () => { S.storeErr = true; S.memsReady = true; renderAll(); });
});
})();
</script>
