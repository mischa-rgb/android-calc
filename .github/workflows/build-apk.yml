name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Recall-Calculator-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish the APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Recall-Calculator.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Recall-Calculator.apk --title "Recall Calculator (latest build)" --notes "Tap Recall-Calculator.apk below to download and install."
